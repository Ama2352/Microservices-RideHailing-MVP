# =============================================================================
# Prometheus Service
# ClusterIP for internal access + NodePort for external access from host
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - name: web
      protocol: TCP
      port: 9090          # Internal cluster port
      targetPort: 9090    # Container port
      nodePort: 30909     # External access port (http://<node-ip>:30909)
