# =============================================================================
# [ARCHIVED] CD Agent Pod Template
#
# This pod template is no longer used by the Jenkinsfile.
# CD stages now run kubectl in a Docker container on jenkins-vm; the cluster
# is reached via the K8s API using a stored ServiceAccount token.
# Kept for reference in case CD is moved back into K8s.
#
# Original purpose: minimal K8s pod with only kubectl for deploy/verify.
# Required hostNetwork due to Calico CIDR overlap with VM subnet.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  serviceAccountName: jenkins
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
  # JNLP - agent process that calls back to the Jenkins controller.
  # Must be named "jnlp"; the Kubernetes plugin injects connection vars at pod
  # creation time.
  - name: jnlp
    image: jenkins/inbound-agent:latest
    env:
    - name: JENKINS_URL
      value: "http://192.168.242.13:8080"
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

  # Kubectl - apply manifests and verify rollout status
  - name: kubectl
    image: alpine/k8s:1.29.0
    command: [cat]
    tty: true
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "128Mi"
        cpu: "100m"
