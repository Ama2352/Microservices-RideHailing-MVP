# =============================================================================
# Jenkins Services
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
  labels:
    app: jenkins
spec:
  type: NodePort
  selector:
    app: jenkins
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30808
    - name: jnlp
      port: 50000
      targetPort: 50000
