# =============================================================================
# Jenkins ServiceAccount + RBAC
# Follows Principle of Least Privilege:
# - ClusterRole: Only for managing Jenkins agent pods in jenkins namespace
# - Role: Scoped permissions for deploying to ride-hailing namespace only
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: jenkins
---
# ClusterRole: Minimal permissions for Jenkins Kubernetes plugin agent lifecycle.
# Bound only to the jenkins namespace via RoleBinding below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-agent-manager
rules:
  # Pod lifecycle — create/delete/patch agents; get/list/watch for status polling
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  # exec — Jenkins plugin runs commands inside agent pods
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # log — stream build output from agent pods
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  # configmaps — the Kubernetes plugin creates a ConfigMap per agent pod to
  # pass the JNLP agent configuration (secret agent name, etc.) as a mounted
  # file. Without create/delete here the pod provisioning silently fails.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete", "get", "list"]
---
# Bind ClusterRole to jenkins SA in jenkins namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent-manager
  namespace: jenkins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: jenkins-agent-manager
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins
---
# Role: Scoped permissions for ride-hailing namespace ONLY.
# Covers exactly the resources present in services/*/k8s.yaml and services/*/istio.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: ride-hailing
rules:
  # Deployment — kubectl apply + rollout status
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # ReplicaSet — queried internally by kubectl rollout status
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  # Service — present in k8s.yaml
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Pods — kubectl rollout status + verify get pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Istio — VirtualService + DestinationRule present in istio.yaml
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
# Bind Role to jenkins SA for ride-hailing namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: ride-hailing
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: jenkins

