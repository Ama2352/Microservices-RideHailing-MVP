# =============================================================================
# PersistentVolume and PersistentVolumeClaim for OWASP Dependency-Check
# Stores NVD (National Vulnerability Database) cache to avoid re-downloading
# Database size: ~500MB-1GB, updated periodically
#
# NOTE: hostPath requires nodeAffinity in multi-node clusters because the
# directory only exists on one node. Agent pods must be scheduled on this node.
# =============================================================================
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dependency-check-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: dependency-check-storage
  # hostPath is simple for local dev/learning clusters
  # For production: use NFS, Ceph, or cloud provider storage
  hostPath:
    path: /var/jenkins-cache/dependency-check
    type: DirectoryOrCreate
  # Required: Pin this PV to a specific node since hostPath is node-local
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k8s-worker-2

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dependency-check-pvc
  namespace: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: dependency-check-storage
  resources:
    requests:
      storage: 2Gi
