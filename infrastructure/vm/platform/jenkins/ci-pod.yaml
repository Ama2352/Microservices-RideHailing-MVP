# =============================================================================
# [ARCHIVED] CI Agent Pod Template
#
# This pod template is no longer used by the Jenkinsfile.
# CI stages now run as ephemeral Docker containers on jenkins-vm (DooD).
# Kept for reference in case CI is moved back into K8s.
#
# Original purpose: K8s pod for all CI stages (test, analyse, build, scan,
# push). Required hostNetwork because the VM subnet (192.168.242.x) falls
# inside the Calico pod CIDR (192.168.0.0/16), causing misrouted traffic.
# =============================================================================
apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  serviceAccountName: jenkins
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet

  containers:
  # JNLP - agent process that calls back to the Jenkins controller.
  # Must be named "jnlp"; the Kubernetes plugin injects connection vars at pod
  # creation time.
  - name: jnlp
    image: jenkins/inbound-agent:latest
    env:
    - name: JENKINS_URL
      value: "http://192.168.242.13:8080"
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

  # Golang - unit tests, go vet, dependency vulnerability scanning (govulncheck)
  - name: golang
    image: golang:1.25.7-alpine
    command: [cat]
    tty: true
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

  # BuildKit - daemonless image builds and push to registry
  - name: buildkit
    image: moby/buildkit:v0.13.2
    securityContext:
      privileged: true
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "2Gi"
        cpu: "1000m"
    readinessProbe:
      exec:
        command: [buildctl, debug, workers]
      initialDelaySeconds: 5
      periodSeconds: 5

  # SonarQube Scanner - static code analysis (SAST)
  - name: sonar-scanner
    image: sonarsource/sonar-scanner-cli:11.3
    command: [cat]
    tty: true
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"

  # Trivy - container image vulnerability scanning
  - name: trivy
    image: aquasec/trivy:0.48.3
    command: [cat]
    tty: true
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
