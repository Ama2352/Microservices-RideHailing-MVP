# =============================================================================
# Istio Gateway - Entry point for external traffic into the service mesh
# =============================================================================
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: ride-hailing-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway  # Use Istio's default ingress gateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"  # Accept traffic for any host (for development/testing)
      # For production, specify actual domains:
      # - "api.yourdomain.com"
