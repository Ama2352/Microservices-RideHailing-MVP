# =============================================================================
# SonarQube Service — NodePort for external access
# Accessible at http://<node-ip>:30090
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: sonarqube
  labels:
    app: sonarqube
spec:
  type: NodePort
  selector:
    app: sonarqube
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30090
      name: http
