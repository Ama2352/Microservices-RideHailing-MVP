# =============================================================================
# SonarQube Deployment — Community Edition
# Uses embedded H2 database (sufficient for learning/small teams)
# For production: use external PostgreSQL
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: sonarqube
  labels:
    app: sonarqube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:

      # Security Context - SonarQube runs as user 1000
      securityContext:
        fsGroup: 1000
        runAsUser: 1000

      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /opt/sonarqube/data"]
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
          securityContext:
            runAsUser: 0

      containers:
        - name: sonarqube
          image: sonarqube:10.7-community
          ports:
            - containerPort: 9000
              name: http
          env:
            # Disable mmap for Elasticsearch (required for constrained environments)
            - name: SONAR_SEARCH_JAVAADDITIONALOPTS
              value: "-Dnode.store.allow_mmap=false"
          resources:
            requests:
              memory: "1Gi"      
              cpu: "500m" 
            limits:
              memory: "2Gi"     
              cpu: "1"
          volumeMounts:
            - name: sonarqube-data
              mountPath: /opt/sonarqube/data
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 30

      volumes:
        - name: sonarqube-data
          persistentVolumeClaim:
            claimName: sonarqube-pvc
